target-version = "py312"
line-length = 110

[format]
skip-magic-trailing-comma = true

[lint]
select = ["E4", "E7", "E9", "F", "I", "W", "RUF", "PLW", "BLE", "EXE"]

[lint.isort]
split-on-trailing-comma = false

[lint.per-file-ignores]
# Django migrations and Model.Meta use list class attributes by convention.
"licenses/migrations/*" = ["RUF012"]
