[project]
name = "license-service"
version = "0.1.0"
description = "Single-tenant license key service"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3,<4",
    "django>=5.2",
    "django-axes>=8.3.1,<9",
    "django-ninja>=1.4,<2",
    "django-ratelimit>=4.1,<5",
    "django-redis>=5.4,<7",
    "django-tailwind-cli>=4.8.0",
    "django-unfold>=0.105.0",
    "django-user-sessions>=2,<3",
    "pydantic>=2.11,<3",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "setuptools>=70,<81",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.uv]
package = false
