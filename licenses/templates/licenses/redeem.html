{% extends "licenses/base.html" %}
{% load i18n %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">{% trans "Redeem a license key" %}</h1>
</div>
<div class="panel max-w-md">
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <label class="field"><span>{{ field.label }}</span>{{ field }}{{ field.errors }}</label>
    {% endfor %}
    <button type="submit" class="btn btn-primary btn-lg mt-6">{% trans "Redeem" %}</button>
  </form>
</div>
{% endblock %}
