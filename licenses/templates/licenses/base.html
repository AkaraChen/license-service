<!doctype html>
{% load tailwind_cli %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}License Service{% endblock %}</title>
  {% tailwind_css %}
</head>
<body class="min-h-screen bg-white font-sans text-neutral-900 antialiased">
  <div class="mx-auto max-w-3xl px-4 py-8">
    <nav class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
      {% if user.is_authenticated %}
        Signed in as <strong>{{ user.username }}</strong>
        <a href="{% url 'ui_home' %}">My entitlements</a>
        <a href="{% url 'ui_redeem' %}">Redeem a key</a>
        <form method="post" action="{% url 'ui_logout' %}" class="inline">{% csrf_token %}<button>Log out</button></form>
      {% else %}
        <a href="{% url 'ui_login' %}">Log in</a>
        <a href="{% url 'ui_register' %}">Register</a>
      {% endif %}
      <a href="{% url 'docs' %}">API docs</a>
    </nav>
    <hr class="my-4 border-neutral-200">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
