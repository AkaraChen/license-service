{% extends "licenses/base.html" %}
{% load i18n %}
{% block content %}
<h1>{% trans "Redeem a license key" %}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="max-w-sm">
  {% csrf_token %}
  <label>{% trans "License key" %} <input name="license_key" required autocomplete="off"></label>
  <button type="submit" class="btn-primary">{% trans "Redeem" %}</button>
</form>
{% endblock %}
