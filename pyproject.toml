[project]
name = "shukka-license"
version = "0.1.0"
description = "Single-tenant license key service"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3,<4",
    "django>=5.2",
    "django-axes>=8.3.1,<9",
    "django-log-request-id>=2.1.2",
    "django-ninja>=1.4,<2",
    "django-ratelimit>=4.1,<5",
    "django-redis>=5.4,<7",
    "django-unfold>=0.105.0",
    "django-user-sessions>=2,<3",
    "pydantic>=2.11,<3",
    "python-json-logger>=4.2.0",
    "setuptools>=70,<81",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
build = [
    "django-tailwind-cli>=4.8.0",
]
dev = [
    {include-group = "build"},
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.16.6",
]

[tool.uv]
package = false
