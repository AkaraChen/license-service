{% extends "licenses/base.html" %}
{% load i18n %}
{% block body_class %}is-auth{% endblock %}
{% block content %}
<div class="panel w-full max-w-[400px] p-8">
  <h1 class="page-title mb-6 text-2xl leading-8 tracking-[-0.03em]">{% trans "Register" %}</h1>
  {% if error %}<p class="error mb-5">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label class="field"><span>{% trans "Username" %}</span><input name="username" required maxlength="150"></label>
    <label class="field"><span>{% trans "Password" %}</span><input name="password" type="password" required></label>
    <button type="submit" class="btn btn-primary btn-lg mt-6 w-full">{% trans "Create account" %}</button>
  </form>
</div>
{% endblock %}
