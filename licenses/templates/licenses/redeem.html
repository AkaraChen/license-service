{% extends "licenses/base.html" %}
{% load i18n %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">{% trans "Redeem a license key" %}</h1>
</div>
<div class="panel max-w-md">
  {% if error %}<p class="error mb-5">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label class="field"><span>{% trans "License key" %}</span><input name="license_key" required autocomplete="off" class="font-mono"></label>
    <button type="submit" class="btn btn-primary btn-lg mt-6">{% trans "Redeem" %}</button>
  </form>
</div>
{% endblock %}
