{% extends "licenses/base.html" %}
{% load i18n %}
{% block content %}
<h1>{% trans "Log in" %}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="max-w-sm">
  {% csrf_token %}
  <label>{% trans "Username" %} <input name="username" required></label>
  <label>{% trans "Password" %} <input name="password" type="password" required></label>
  <button type="submit" class="btn-primary">{% trans "Log in" %}</button>
</form>
{% endblock %}
